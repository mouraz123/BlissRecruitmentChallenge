name: iOS Simulator Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project BlissRecruitmentChallenge.xcodeproj
          -scheme BlissRecruitmentChallenge
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: BlissRecruitmentChallenge-iOS-Simulator
          path: DerivedData/Build/Products/Debug-iphonesimulator/BlissRecruitmentChallenge.app
